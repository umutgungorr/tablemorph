[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tablemorph"
version = "0.1.0"
description = "⚡ Zero-dependency multi-format bidirectional table converter and schema inspector (MD, CSV, JSON, SQL, TSV, HTML)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["table", "csv", "tsv", "json", "markdown", "sql", "cli", "converter", "schema"]
authors = [
    { name = "Umut Güngör", email = "umutgungor.dev@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Text Processing",
]
dependencies = []

[project.scripts]
tablemorph = "tablemorph.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tablemorph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
